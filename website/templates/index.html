<!DOCTYPE html>
<html>
<head>
    <title>Testing</title>
    <style>
        .gallery { display: flex; flex-wrap: wrap; gap: 10px; }
        .gallery img { width: 480px; height: auto; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Testing</h1>
    <div class="gallery">
        {% for img in images %}
            <img src="{{ url_for('static', filename='images/' + img.filename) }}">
        {% endfor %}
    </div>
</body>
</html>
