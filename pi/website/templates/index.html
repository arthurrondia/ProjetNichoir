<!DOCTYPE html>
<html>
<head>
    <title>Nichoir Coolos</title>
    <style>
        .battery-card { background: #f4f4f4; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: inline-block; }
        .gallery { display: flex; flex-wrap: wrap; gap: 10px; }
        .gallery img { width: 480px; height: auto; border-radius: 8px; }
        .button { background: #ff4444; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Nichoir Super Cool</h1>
    <div class="battery-card">
        <h3>Statut batterie:</h3>
        {% if battery %}
            <p>Dernier relevé de batterie: <strong>{{ battery.level }}%</strong> (à {{ battery.timestamp.strftime('%H:%M:%S') }})</p>
        {% else %}
            <p>Pas encore reçu de données de batterie.</p>
        {% endif %}
    </div>
    <div class="gallery">
        {% for img in images %}
            <img src="{{ url_for('static', filename='images/' + img.filename) }}">
        {% endfor %}
    </div>
</body>
</html>
